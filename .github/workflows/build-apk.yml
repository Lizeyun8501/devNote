name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'devnote/lib/**'
      - 'devnote/pubspec.yaml'
      - 'devnote/pubspec.lock'
      - 'devnote/android/**'
      - 'devnote/rust-core/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'devnote/lib/**'
      - 'devnote/pubspec.yaml'
      - 'devnote/pubspec.lock'
      - 'devnote/android/**'
      - 'devnote/rust-core/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devnote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: devnote/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
