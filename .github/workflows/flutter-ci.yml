name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'devnote/lib/**'
      - 'devnote/pubspec.yaml'
      - 'devnote/pubspec.lock'
      - 'devnote/analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'devnote/lib/**'
      - 'devnote/pubspec.yaml'
      - 'devnote/pubspec.lock'
      - 'devnote/analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'

jobs:
  build:
    name: Flutter CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devnote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        # 修复(P0): 移除 `|| echo` 兜底和 `continue-on-error: true`，
        # 原配置会静默吞掉测试失败，导致 CI 无法阻断有 Bug 的代码合并。
        run: flutter test --no-pub
