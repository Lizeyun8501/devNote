name: Bug report
description: Report a bug to help us improve DevNote
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report! Before submitting,
        please search existing issues to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages, logs, or screenshots if possible.
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) does the bug occur on?
      options:
        - label: Android
        - label: iOS
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Web
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The DevNote version you are using (e.g. 1.0.0).
      placeholder: "1.0.0"
    validations:
      required: true
