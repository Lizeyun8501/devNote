# Go CI —— go test + vet + govulncheck
#
# P0-3 修复: 建立自动化 Go 质量保障流水线
# - go test ./...: 单元测试与集成测试
# - go vet: 静态分析
# - govulncheck: 已知漏洞扫描（Go Vulnerability Database）
#
# 覆盖两个 Go 服务:
#   - sync-server/      同步服务
#   - business-server/  业务服务
#
# 触发条件: sync-server/、business-server/ 或本工作流文件变更时
name: Go CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sync-server/**'
      - 'business-server/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'sync-server/**'
      - 'business-server/**'
      - '.github/workflows/go.yml'

jobs:
  test:
    name: Test & Vet (sync-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 静态分析 (go vet)
        run: go vet ./...

      - name: 单元测试与集成测试
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sync-server-coverage
          path: sync-server/coverage.out

  test-business:
    name: Test & Vet (business-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-server
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version-file: business-server/go.mod
          cache-dependency-path: business-server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 静态分析 (go vet)
        run: go vet ./...

      - name: 单元测试与集成测试
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: business-server-coverage
          path: business-server/coverage.out

  vulncheck:
    name: 漏洞扫描 (govulncheck)
    runs-on: ubuntu-latest
    # P1 修复 (X2): 原设置 continue-on-error: true 导致 Go 漏洞不阻塞合并，
    # 已知漏洞可能被合入主干。现移除该设置，安全扫描失败将阻断 PR 合并。
    strategy:
      matrix:
        server: [sync-server, business-server]
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Go 工具链
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 漏洞扫描 (${{ matrix.server }})
        working-directory: ${{ matrix.server }}
        run: govulncheck ./...
