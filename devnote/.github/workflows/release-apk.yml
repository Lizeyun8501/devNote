# Build Release APK —— 构建 Flutter Android Release APK
#
# 触发条件: 推送 tag (v*) 或手动触发
# 产出: signed-unsigned release APK artifact
name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 显示版本信息
        run: flutter --version

      - name: 依赖解析 (flutter pub get)
        run: flutter pub get

      - name: 代码生成 (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 Release APK
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
