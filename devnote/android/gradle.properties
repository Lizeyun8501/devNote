org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:+DisableExplicitGC -XX:-UseContainerSupport
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 内存受限沙箱: Kotlin 编译器在进程内执行，避免独立 Kotlin daemon 占用额外内存
kotlin.compiler.execution.strategy=in-process
# 限制并行 worker，降低峰值内存
org.gradle.workers.max=1
# 禁用配置缓存以减少内存占用
org.gradle.configuration-cache=false

# 沙箱 HTTP 代理 —— Java/Gradle 不读 http_proxy 环境变量，需显式设置
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
