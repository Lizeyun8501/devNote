version: "3.8"

services:
  business-server:
    build:
      context: ./business-server
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_PATH=/app/data/business.db
      - JWT_SECRET=${JWT_SECRET:-devnote-business-secret-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MAX_TAG_DEPTH=5
      - MAX_FOLDER_DEPTH=10
      - MAX_NOTE_SIZE=10485760
      - PAGERANK_DAMPING=0.85
      - PAGERANK_ITERS=100
    volumes:
      - business-data:/app/data
    restart: unless-stopped

  sync-server:
    build:
      context: ./sync-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/sync.db
      - JWT_SECRET=${JWT_SECRET:-devnote-sync-secret-key}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET=devnote-sync
      - S3_USE_SSL=false
      - RATE_LIMIT=100
    volumes:
      - sync-data:/app/data
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  business-data:
  sync-data:
  minio-data: