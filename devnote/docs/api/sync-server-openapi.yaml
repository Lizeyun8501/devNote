openapi: 3.0.3
info:
  title: DevNote Sync Server API
  description: |
    API for DevNote's sync server, providing user authentication (including SRP zero-knowledge auth),
    note synchronization (push/pull), conflict resolution, and sync status management.
  version: 1.0.0
  contact:
    name: DevNote Team
servers:
  - url: http://localhost:8080
    description: Local development (HTTP)
  - url: https://localhost:8443
    description: Local development (HTTPS)

tags:
  - name: health
    description: Health check and metrics
  - name: auth
    description: Standard username/password authentication
  - name: srp-auth
    description: SRP (Secure Remote Password) zero-knowledge authentication
  - name: sync
    description: Note synchronization operations (push, pull, status, conflict resolution)
  - name: version-history
    description: Note version history and snapshot retrieval
  - name: sharing
    description: Public note sharing and publishing
  - name: email
    description: Email-to-note alias management and inbound webhooks
  - name: clipper
    description: Web clipper extension for saving web content as notes
  - name: realtime
    description: Real-time collaboration over WebSocket

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: devnote-sync-server

  /metrics:
    get:
      tags:
        - health
      summary: Prometheus metrics
      operationId: prometheusMetrics
      description: Returns Prometheus-format metrics.
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

  /api/v1/auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - auth
      summary: Login with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: Logout and revoke refresh token
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out

  /api/v1/auth/srp/register:
    post:
      tags:
        - srp-auth
      summary: Register with SRP zero-knowledge protocol
      operationId: srpRegister
      description: Register a new user using the Secure Remote Password (SRP) protocol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SRPRegisterRequest'
      responses:
        '201':
          description: User registered with SRP successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  srp_enabled:
                    type: boolean
                    example: true
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/srp/init:
    post:
      tags:
        - srp-auth
      summary: Initiate SRP authentication
      operationId: srpInit
      description: Start the SRP authentication flow. Server returns salt and public ephemeral value B.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SRPInitRequest'
      responses:
        '200':
          description: SRP challenge returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SRPInitResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/srp/verify:
    post:
      tags:
        - srp-auth
      summary: Verify SRP client proof
      operationId: srpVerify
      description: Submit client's public ephemeral A and proof M1. Server returns M2 proof and session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SRPVerifyRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SRPVerifyResponse'
        '400':
          description: Invalid request or encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/push:
    post:
      tags:
        - sync
      summary: Push local changes to the server
      operationId: pushChanges
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Changes pushed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/pull:
    post:
      tags:
        - sync
      summary: Pull remote changes from the server
      operationId: pullChanges
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return (1-1000, default 100)
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PullRequest'
      responses:
        '200':
          description: Changes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/status:
    get:
      tags:
        - sync
      summary: Get sync status for a device
      operationId: getSyncStatus
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: true
          description: The device identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sync status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '400':
          description: Missing device_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/resolve-conflict:
    post:
      tags:
        - sync
      summary: Resolve a sync conflict
      operationId: resolveConflict
      security:
        - BearerAuth: []
      description: Manually resolve a sync conflict by providing the chosen data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolution'
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: resolved
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # P1 修复 (X1): 以下端点由客户端 devnote_api_client.dart 直接通过 http Client
  # 调用，但此前未在 OpenAPI 规范中定义，构成契约漂移。现补充至规范以统一契约。
  # 服务端尚未实现，作为计划中的增量同步（rsync 算法 + 断点续传）接口契约。

  /api/v1/sync/conflicts/resolve:
    post:
      tags:
        - sync
      summary: Report conflict resolution result
      operationId: reportConflictResolution
      security:
        - BearerAuth: []
      description: |
        上报冲突解决结果（best-effort）。
        与 resolveConflict（/api/v1/sync/resolve-conflict）语义不同：
        后者用于手动解决冲突并提供所选数据，本端点用于通知服务端已采取的解决策略。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conflict_id
                - resolution
              properties:
                conflict_id:
                  type: string
                resolution:
                  type: string
      responses:
        '200':
          description: Conflict resolution reported
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/signatures:
    get:
      tags:
        - sync
      summary: Fetch remote data signatures
      operationId: fetchRemoteSignatures
      security:
        - BearerAuth: []
      description: 获取远端数据签名（用于增量同步计算基准）。远端无数据时返回 204。
      responses:
        '200':
          description: Signature data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '204':
          description: No remote data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - sync
      summary: Update remote data signatures
      operationId: updateRemoteSignatures
      security:
        - BearerAuth: []
      description: 上传远端签名（供下次增量计算使用）。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Signatures updated
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/delta:
    post:
      tags:
        - sync
      summary: Request remote delta computation
      operationId: fetchRemoteDelta
      security:
        - BearerAuth: []
      description: |
        请求远端计算并返回 delta（基于客户端提供的本地签名）。
        远端无新数据时返回 204。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Delta data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '204':
          description: No new data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/chunk:
    post:
      tags:
        - sync
      summary: Upload a single chunk
      operationId: uploadChunk
      security:
        - BearerAuth: []
      description: |
        上传单个分块（借鉴 tus.io 协议的 Upload-Offset / Upload-Length 头部）。
        通过 X-Session-Id / X-Chunk-Index / X-Total-Chunks 头部传递分块元数据。
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Chunk-Index
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Total-Chunks
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk uploaded successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/commit:
    post:
      tags:
        - sync
      summary: Commit a chunked upload session
      operationId: commitSession
      security:
        - BearerAuth: []
      description: 通知服务端合并所有分块并完成同步。
      parameters:
        - name: session
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session committed successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/abort:
    delete:
      tags:
        - sync
      summary: Abort a chunked upload session
      operationId: abortRemoteSession
      security:
        - BearerAuth: []
      description: 通知服务端放弃会话。
      parameters:
        - name: session
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session aborted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/notes/{noteId}/history:
    get:
      tags:
        - version-history
      summary: Get note version history
      operationId: getNoteHistory
      security:
        - BearerAuth: []
      description: Retrieve the version history (snapshots) for a given note.
      parameters:
        - name: noteId
          in: path
          required: true
          description: The note identifier
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of versions to return (1-1000, default 50)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Version history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/NoteVersionItem'
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sync/notes/{noteId}/versions/{version}:
    get:
      tags:
        - version-history
      summary: Get a specific note version
      operationId: getNoteVersion
      security:
        - BearerAuth: []
      description: Retrieve a specific version (snapshot) of a note.
      parameters:
        - name: noteId
          in: path
          required: true
          description: The note identifier
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          description: The version number (int64)
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Note version retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteVersionDetail'
        '400':
          description: Invalid version parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/notes/clip:
    post:
      tags:
        - clipper
      summary: Clip a web page as a new note
      operationId: clipNote
      security:
        - BearerAuth: []
      description: |
        Save web content (from the browser clipper extension) as a new note via the sync pipeline.
        The clipped content is stored as Markdown and persisted through SyncService.Push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipRequest'
      responses:
        '200':
          description: Note clipped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/shares:
    post:
      tags:
        - sharing
      summary: Create a share for a note
      operationId: createShare
      security:
        - BearerAuth: []
      description: |
        Create a public share link for a note. Optionally protect it with a password
        and set an expiration time. Returns the share token and URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareRequest'
      responses:
        '200':
          description: Share created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShareResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - sharing
      summary: List all shares for the current user
      operationId: listShares
      security:
        - BearerAuth: []
      description: Retrieve all shares created by the authenticated user.
      responses:
        '200':
          description: Shares retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Share'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/shares/{shareId}:
    delete:
      tags:
        - sharing
      summary: Delete a share
      operationId: deleteShare
      security:
        - BearerAuth: []
      description: Soft-delete a share by its ID. The shared note will no longer be publicly accessible.
      parameters:
        - name: shareId
          in: path
          required: true
          description: The share identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Share deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /s/{token}:
    get:
      tags:
        - sharing
      summary: Access a shared note publicly
      operationId: getSharedNote
      description: |
        Publicly access a shared note by its token. No authentication required.
        If the share is password-protected, supply the password via the `password` query parameter.
      parameters:
        - name: token
          in: path
          required: true
          description: The share token
          schema:
            type: string
        - name: password
          in: query
          required: false
          description: Password for password-protected shares
          schema:
            type: string
      responses:
        '200':
          description: Shared note retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedNotePublic'
        '404':
          description: Share not found, expired, or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/alias:
    get:
      tags:
        - email
      summary: Get the current user's email alias
      operationId: getEmailAlias
      security:
        - BearerAuth: []
      description: |
        Retrieve the active email alias for the authenticated user.
        If no alias exists yet, a new one is created on demand.
      responses:
        '200':
          description: Email alias retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAlias'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/email/alias/regenerate:
    post:
      tags:
        - email
      summary: Regenerate the user's email alias
      operationId: regenerateEmailAlias
      security:
        - BearerAuth: []
      description: |
        Deactivate the current email alias (if any) and generate a new one.
        The old alias immediately stops receiving emails.
      responses:
        '200':
          description: New email alias generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAlias'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/email:
    post:
      tags:
        - email
      summary: Inbound email webhook
      operationId: incomingEmailWebhook
      description: |
        Receives inbound emails from providers such as SendGrid, Mailgun, or SES,
        and converts them into notes via the email-to-note pipeline.

        **签名验证机制：** 当服务端配置了 webhook 密钥时，调用方必须使用该共享密钥
        对原始请求体计算 HMAC-SHA256，并将十六进制编码的摘要放入
        `X-Webhook-Signature` 请求头。服务端使用同一密钥重新计算 HMAC，
        并通过 `hmac.Equal` 进行常量时间比较以防止时序攻击。缺失或不匹配的
        签名将被拒绝并返回 401。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingEmailRequest'
      responses:
        '200':
          description: Email processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: processed
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /realtime:
    get:
      tags:
        - realtime
      summary: WebSocket endpoint for real-time collaboration
      operationId: realtimeConnect
      x-websocket: true
      description: |
        WebSocket 升级端点，用于笔记实时协作。

        这**不是**普通的 HTTP GET 请求；客户端必须发起 WebSocket 升级握手
        （`Upgrade: websocket`）。升级成功后，连接作为双向 WebSocket 保持打开。

        **认证方式：** 由于 WebSocket 客户端在升级期间无法发送标准的
        `Authorization: Bearer` 请求头，JWT 访问令牌通过 `token` 查询参数传递。
        服务端在完成升级前校验该令牌；缺失或无效的令牌将返回 401。

        **消息协议：** 连接建立后，客户端必须以 `join` 消息作为首帧，指定
        `noteId`、`deviceId`、`userId` 和 `name`。服务端响应携带当前协作者列表的
        `join` ack，随后在同一笔记房间内广播 `presence` 更新并中继 `op` 消息。
        还支持 `sync_request` / `sync_response` 和 `heartbeat` 消息。
        消息格式参见 `WSMessage` schema。
      parameters:
        - name: token
          in: query
          required: true
          description: JWT access token (WebSocket 升级期间无法使用 Bearer 请求头)
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols — WebSocket 升级成功
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login or SRP verify endpoint.

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: john_doe
        password:
          type: string
          minLength: 6
          example: secret123

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: secret123

    LoginResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        expires_in:
          type: integer
          description: Token expiration time in seconds
          example: 3600

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: New JWT access token
        refresh_token:
          type: string
          description: New JWT refresh token
        expires_in:
          type: integer
          description: Token expiration time in seconds
          example: 3600

    SRPRegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: john_doe
        password:
          type: string
          minLength: 6
          example: secret123

    SRPInitRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          example: john_doe

    SRPInitResponse:
      type: object
      properties:
        salt:
          type: string
          description: Base64-encoded SRP salt
        B:
          type: string
          description: Base64-encoded server public ephemeral value

    SRPVerifyRequest:
      type: object
      required:
        - username
        - A
        - M1
      properties:
        username:
          type: string
          example: john_doe
        A:
          type: string
          description: Base64-encoded client public ephemeral value
        M1:
          type: string
          description: Base64-encoded client proof

    SRPVerifyResponse:
      type: object
      properties:
        M2:
          type: string
          description: Base64-encoded server proof
        token:
          type: string
          description: JWT session token
        user_id:
          type: string
          format: uuid
        username:
          type: string

    PushRequest:
      type: object
      required:
        - device_id
        - records
      properties:
        device_id:
          type: string
          format: uuid
          description: Device identifier
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecordInput'
          description: List of sync records to push

    SyncRecordInput:
      type: object
      required:
        - note_id
        - action
      properties:
        note_id:
          type: string
          format: uuid
          description: Note identifier
        action:
          type: string
          enum:
            - create
            - update
            - delete
          description: Action type for this record
        version:
          type: integer
          format: int64
          description: Client-side version number
        payload:
          type: string
          description: Note content payload (CRDT or plain text)

    PushResponse:
      type: object
      properties:
        processed:
          type: integer
          description: Number of records successfully processed
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
          description: List of detected conflicts (if any)

    PullRequest:
      type: object
      required:
        - device_id
      properties:
        device_id:
          type: string
          format: uuid
          description: Device identifier
        since_version:
          type: integer
          format: int64
          description: Pull records with version greater than this value

    PullResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SyncRecord'
          description: List of sync records
        latest_version:
          type: integer
          format: int64
          description: Latest version number on the server
        has_more:
          type: boolean
          description: Whether more records are available
        limit:
          type: integer
          description: Number of records returned in this response

    SyncRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - create
            - update
            - delete
        version:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        payload:
          type: string
        created_at:
          type: string
          format: date-time

    SyncStatus:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        last_sync_at:
          type: string
          format: date-time
        last_sync_version:
          type: integer
          format: int64
        latest_version:
          type: integer
          format: int64
        pending_count:
          type: integer
          format: int64
          description: Number of pending changes not yet synced to this device

    Conflict:
      type: object
      properties:
        record_id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
        local_version:
          type: integer
          format: int64
        server_version:
          type: integer
          format: int64
        local_data:
          type: string
        server_data:
          type: string
        strategy:
          type: string
          enum:
            - last_write_wins
            - manual

    ConflictResolution:
      type: object
      required:
        - note_id
        - chosen_data
        - version
      properties:
        note_id:
          type: string
          format: uuid
        chosen_data:
          type: string
          description: The data chosen to resolve the conflict
        version:
          type: integer
          format: int64

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error description

    CreateShareRequest:
      type: object
      required:
        - note_id
        - title
        - content
      properties:
        note_id:
          type: string
          format: uuid
          description: The note to share
        title:
          type: string
          description: Title displayed on the shared page
        content:
          type: string
          description: Note content to publish (Markdown)
        password:
          type: string
          description: Optional password to protect the share. Omit for a public share.
        expires_in:
          type: integer
          format: int64
          description: Expiration duration in seconds. 0 (default) means never expires.
          example: 86400

    CreateShareResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The share identifier
        share_token:
          type: string
          description: Public token used to access the share at /s/{token}
        share_url:
          type: string
          description: Relative URL for public access
          example: /s/abc123def456
        has_password:
          type: boolean
          description: Whether the share is password-protected
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp, or null if never expires
        created_at:
          type: string
          format: date-time

    Share:
      type: object
      description: A share record as stored on the server
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
        share_token:
          type: string
        title:
          type: string
        content:
          type: string
        has_password:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        view_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SharedNotePublic:
      type: object
      description: Public view of a shared note (returned by /s/{token})
      properties:
        title:
          type: string
        content:
          type: string
          description: Note content (Markdown)
        view_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        has_password:
          type: boolean
          description: Whether the share is password-protected

    EmailAlias:
      type: object
      properties:
        alias:
          type: string
          description: Short random alias
          example: a1b2c3d4
        email_addr:
          type: string
          description: Full email address to which inbound emails are sent
          example: a1b2c3d4@mail.devnote.app
        active:
          type: boolean
          description: Whether the alias is currently active

    IncomingEmailRequest:
      type: object
      properties:
        to:
          type: string
          description: Recipient address (the user's alias)
        from:
          type: string
          description: Sender address
        subject:
          type: string
          description: Email subject
        text_body:
          type: string
          description: Plain-text email body
        html_body:
          type: string
          description: HTML email body

    ClipRequest:
      type: object
      required:
        - title
        - content
        - source_url
      properties:
        title:
          type: string
          description: Note title
        content:
          type: string
          description: Clipped content in Markdown format
        source_url:
          type: string
          format: uri
          description: Original URL of the clipped page
        folder_id:
          type: string
          format: uuid
          description: Optional target folder for the new note
        tags:
          type: array
          items:
            type: string
          description: Optional tags to attach to the note

    ClipResponse:
      type: object
      properties:
        note_id:
          type: string
          format: uuid
          description: The newly created note's identifier
        version:
          type: integer
          format: int64
          description: Server-assigned version number of the created note
        created_at:
          type: string
          format: date-time

    NoteVersionItem:
      type: object
      description: A single version entry in the note history
      properties:
        version:
          type: integer
          format: int64
        content:
          type: string
          description: Note content snapshot
        checksum:
          type: string
          description: Content checksum for integrity verification
        created_at:
          type: string
          format: date-time

    NoteVersionDetail:
      type: object
      description: A specific note version snapshot
      properties:
        version:
          type: integer
          format: int64
        content:
          type: string
          description: Note content snapshot
        checksum:
          type: string
          description: Content checksum for integrity verification
        created_at:
          type: string
          format: date-time

    WSMessage:
      type: object
      description: |
        WebSocket 消息信封，由 /realtime 端点使用。
        字段名采用 camelCase，与客户端 Dart 协议对齐。
        每种 `type` 只填充与其相关的字段。
      properties:
        type:
          type: string
          enum:
            - join
            - op
            - presence
            - sync_request
            - sync_response
            - heartbeat
          description: 消息类型
        noteId:
          type: string
          description: 笔记标识符（用于 `join`）
        userId:
          type: string
          description: 用户标识符（用于 `join`）
        deviceId:
          type: string
          description: 设备标识符（用于 `join`、`sync_request`）
        name:
          type: string
          description: 显示名称（用于 `join`）
        operation:
          type: object
          additionalProperties: true
          description: 操作载荷（用于 `op`）
        state:
          type: object
          additionalProperties: true
          description: presence 状态（用于 `presence`）
        since:
          description: 增量同步游标（用于 `sync_request`）
        operations:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 操作历史（用于 `sync_response`）
        peers:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 当前协作者列表（用于 `join` ack）
        timestamp:
          type: integer
          format: int64
          description: 服务端时间戳，毫秒（用于 `heartbeat`）
