name: devnote
description: "A cloud-based note-taking application"
license: MIT
repository: https://github.com/Lizeyun8501/devNote
issue_tracker: https://github.com/Lizeyun8501/devNote/issues
homepage: https://github.com/Lizeyun8501/devNote
publish_to: 'none'
version: 1.0.0+1

# ============================================================
# 桌面端支持（macOS / Windows / Linux）
# ------------------------------------------------------------
# 借鉴 AppFlowy 的全平台策略 —— Flutter 一套代码覆盖 6 个平台
# 来源: https://github.com/AppFlowy-IO/AppFlowy
#
# 平台目录已就绪：
#   - macos/    macOS 原生（Xcode + Swift）
#   - windows/  Windows 原生（MSVC + C++）
#   - linux/    Linux 原生（CMake + GTK）
#
# 如需重新生成或更新平台目录，运行：
#   ./scripts/enable_desktop.sh
# 或手动执行：
#   flutter create --platforms=macos,windows,linux .
#
# 构建命令：
#   flutter build macos
#   flutter build windows
#   flutter build linux
# ============================================================

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  provider: ^6.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.1
  intl: ^0.20.2
  ffi: ^2.1.4
  web_socket_channel: ^3.0.1
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  # SHA-256 / HMAC-SHA256 等哈希算法 —— 用于 S3 AWS Signature V4 签名
  crypto: ^3.0.3
  diff_match_patch: ^0.4.1
  get_it: ^8.0.0
  # 集成 Sentry 崩溃报告 —— 借鉴 AppFlowy 的 Sentry 集成方案
  # 来源: https://github.com/AppFlowy-IO/AppFlowy
  sentry_flutter: ^8.0.0
  # 代码片段文件选择器（导入/导出功能）
  file_picker: ^8.0.0
  # PDF 导出 —— 借鉴 pdf.dart 库：https://github.com/DavBfr/dart_pdf
  pdf: ^3.10.7
  printing: ^5.12.0
  # 知识图谱可视化 —— 替代自研 CustomPaint 渲染
  # 来源: https://pub.dev/packages/graphview
  graphview: ^1.2.0
  # 代码语法高亮 —— 替代自研 tokenizer，支持 190+ 语言和 87 种主题
  # 来源: https://pub.dev/packages/flutter_highlight
  flutter_highlight: ^0.7.0
  # 虚拟滚动列表 —— 替代自研 VirtualScrollController
  # Google 官方维护，支持 scrollToIndex/jumpToIndex
  # 来源: https://pub.dev/packages/scrollable_positioned_list
  scrollable_positioned_list: ^0.3.8
  # OpenTelemetry 可观测性框架 —— 替代自建 Prometheus/Grafana 风格监控引擎
  # CNCF 标准，提供 Counter、Histogram、MeterProvider 等指标仪器
  # 来源: https://pub.dev/packages/opentelemetry
  opentelemetry: ^0.18.0
  # 高级数据表格 —— 替代 Flutter 内置 DataTable
  # 借鉴 pluto_grid，支持列拖拽、排序、过滤、分页、内联编辑
  # 来源: https://pub.dev/packages/pluto_grid
  pluto_grid: ^8.0.0
  # ============================================================
  # flutter_rust_bridge v2 —— 替代自研 FFI 桥接层
  # 自动生成类型安全的 Dart-Rust 绑定，消除手写 malloc/free 和 JSON 序列化
  # 支持 async/await、Stream、SSE 编解码器（比 JSON 快数倍）
  # Flutter Favorite 认证
  # 来源: https://pub.dev/packages/flutter_rust_bridge
  # ============================================================
  flutter_rust_bridge: ^2.12.0
  # ============================================================
  # pointycastle —— 纯 Dart 加密库，提供 AES-256-GCM 和 PBKDF2
  # 替代 XOR 原型加密，实现生产级端到端加密（零 FFI 依赖）
  # 注意：encrypt 包不支持 GCM 模式，故直接使用 pointycastle
  # 来源: https://pub.dev/packages/pointycastle
  # ============================================================
  pointycastle: ^3.7.0
  # ============================================================
  # perfect_freehand —— 压感手写笔触渲染
  # 来源: https://pub.dev/packages/perfect_freehand
  # 用于 Ink 手写绘图，支持 Apple Pencil / Surface Pen 压感
  # ============================================================
  perfect_freehand: ^2.0.0
  # ============================================================
  # 语音速记 —— 录音 / 播放 / 麦克风权限
  # ------------------------------------------------------------
  # record: 音频录制（AAC-LC 编码，支持 m4a 输出）
  # audioplayers: 音频播放（支持本地文件播放、进度控制）
  # permission_handler: 运行时权限请求（麦克风）
  # ============================================================
  record: ^5.1.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1
  # ============================================================
  # PDF 查看 / 标注 —— 借鉴印象笔记和 Notion 的 PDF 标注能力
  # ------------------------------------------------------------
  # pdfx: PDF 渲染与查看（pinch 缩放、翻页）
  # 来源: https://pub.dev/packages/pdfx
  # 注：syncfusion_flutter_pdfviewer 需注册社区许可证，故选用 pdfx
  # path_provider / file_picker 已在上方声明，复用即可
  # ============================================================
  pdfx: ^2.6.0
  # ============================================================
  # P2-8: OneNote 导入工具
  # ------------------------------------------------------------
  # html: 解析 OneNote 导出的 HTML 文件（DOM 树遍历）
  # 来源: https://pub.dev/packages/html
  # url_launcher: 启动 Microsoft Graph OAuth2 授权流程
  # 来源: https://pub.dev/packages/url_launcher
  # ============================================================
  html: ^0.15.4
  url_launcher: ^6.3.1
  # ============================================================
  # P2-5: 全局待办/提醒系统 —— 本地通知 + 时区支持
  # ------------------------------------------------------------
  # flutter_local_notifications: 跨平台本地通知（待办到期提醒）
  # timezone: 时区数据库，支持 zonedSchedule 按本地时区调度
  # 对标印象笔记、有道云笔记、Notesnook 的待办提醒功能
  # ============================================================
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # ============================================================
  # P2-9: OpenAPI 契约驱动 Dart 客户端
  # 由 openapi-generator 从 docs/api/*.yaml 自动生成
  # 运行 ./scripts/generate_api_client.sh 重新生成
  # ============================================================
  devnote_sync_api:
    path: lib/api/generated/sync_server
  devnote_business_api:
    path: lib/api/generated/business_server

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  # 测试依赖 —— BLoC 测试、Mock 框架、集成测试
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
