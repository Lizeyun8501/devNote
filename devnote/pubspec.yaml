name: devnote
description: "A cloud-based note-taking application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  provider: ^6.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.0
  sqflite: ^2.4.1
  intl: ^0.20.2
  ffi: ^2.1.4
  web_socket_channel: ^3.0.1
  flutter_math_fork: ^0.7.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  diff_match_patch: ^0.4.1
  get_it: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
