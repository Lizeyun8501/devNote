[package]
name = "devnote"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[workspace]
# 17 个核心 crate（原 23 个，合并 6 个扩展 crate 为 devnote-extensions）
# devnote-qt 是可选的 Qt 桥接 crate(动态加载 libdevnote_qt_bridge.so 作为桌面端 fallback)
# 当前不通过任何生产代码直接依赖 —— 仅作为 reference 编译,未来可作为 devnote-canvas 的高级渲染后端
# 编译时可执行 `cargo build -p devnote-qt` 单独验证
members = [
    "devnote-core",
    "devnote-ffi",
    "devnote-persistence",
    "devnote-crypto",
    "devnote-sync",
    "devnote-search",
    "devnote-editor",
    "devnote-extensions",
    "devnote-crdt",
    # devnote-p2p removed: 未被任何生产 crate 依赖，属于死代码，保留目录供未来参考
    # "devnote-p2p",
    "devnote-plugin",
    "devnote-graph",
    "devnote-flashcard",
    # devnote-perf removed: 未被任何生产 crate 依赖，属于死代码，保留目录供未来参考
    # "devnote-perf",
    # devnote-grpc removed: gRPC 契约已移除，当前架构使用 FRB v2 (Flutter↔Rust) + REST/WebSocket (Flutter↔Go)
    # devnote-websocket removed: 未被任何 crate 依赖，实时通信由 Go sync-server 的 gorilla/websocket 承担
    # devnote-qt removed: Qt 桥接 crate 已从 workspace 中移除，不再作为成员编译
    # "devnote-qt",
    # devnote-events removed: Event-Dispatch 模式已被 FRB v2 直接函数调用取代，事件枚举为死代码
    "devnote-database",
    "devnote-object",
    # 修复(P0): devnote-observe 此前遗漏为 workspace 成员，但其 Cargo.toml
    # 使用了 version.workspace = true 等 workspace 继承字段，非成员无法解析，
    # 导致依赖它的 crate（如 devnote-core）构建失败。
    "devnote-observe",
    # P1-5: 以下 6 个 crate 已合并为 devnote-extensions（feature flag 控制）
    # devnote-math-ink, devnote-ocr, devnote-ipfs, devnote-canvas, devnote-workflow, devnote-format
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DevNote Team"]
license = "MIT"

[workspace.dependencies]
devnote-observe = { path = "devnote-observe" }
devnote-core = { path = "devnote-core" }
devnote-ffi = { path = "devnote-ffi" }
devnote-persistence = { path = "devnote-persistence" }
devnote-crypto = { path = "devnote-crypto" }
devnote-sync = { path = "devnote-sync" }
devnote-search = { path = "devnote-search" }
devnote-editor = { path = "devnote-editor" }
devnote-extensions = { path = "devnote-extensions" }
devnote-crdt = { path = "devnote-crdt" }
# devnote-p2p removed: 未被任何生产 crate 依赖，属于死代码，保留目录供未来参考
# devnote-p2p = { path = "devnote-p2p" }
devnote-database = { path = "devnote-database" }
devnote-object = { path = "devnote-object" }
devnote-graph = { path = "devnote-graph" }
devnote-flashcard = { path = "devnote-flashcard" }
# devnote-perf removed: 未被任何生产 crate 依赖，属于死代码，保留目录供未来参考
# devnote-perf = { path = "devnote-perf" }
# devnote-qt removed: Qt 桥接 crate 已从 workspace 依赖中移除
# devnote-qt = { path = "devnote-qt" }
# devnote-grpc removed: gRPC 契约已移除
# devnote-websocket removed: 未被任何 crate 依赖
# devnote-events removed: Event-Dispatch 模式已被 FRB v2 取代
# P1-5: 以下 6 个 crate 已合并为 devnote-extensions（feature flag 控制）
# devnote-format, devnote-canvas, devnote-workflow, devnote-ipfs, devnote-ocr, devnote-math-ink
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["tonic", "metrics"] }
tracing-opentelemetry = "0.25"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# ============================================================
# 开源模块替换依赖
# devnote-plugin 从自研 wasmtime 沙箱 → extism 通用插件框架
# devnote-graph  从自研图算法 → petgraph 专业图结构库
# ============================================================
extism = { version = "1" }
petgraph = "0.7"

[dev-dependencies]
devnote-ffi = { workspace = true }
devnote-crdt = { workspace = true }
devnote-persistence = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tempfile = "3"