[package]
name = "devnote-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# cdylib: 供 Flutter 加载的动态库
# lib: 供 Rust 集成测试使用
crate-type = ["cdylib", "lib"]

[dependencies]
devnote-core = { workspace = true }
devnote-observe = { workspace = true }
devnote-persistence = { workspace = true }
devnote-crypto = { workspace = true }
devnote-editor = { workspace = true }
devnote-search = { workspace = true }
devnote-sync = { workspace = true }
devnote-extensions = { workspace = true, features = ["math-ink", "ocr", "canvas", "format"] }
devnote-database = { workspace = true }
devnote-object = { workspace = true }
devnote-graph = { workspace = true }
devnote-crdt = { workspace = true }
devnote-flashcard = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["full"] }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
parking_lot = "0.12"
lazy_static = "1"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "tracing"] }
sentry-anyhow = "0.34"
# ============================================================
# 共享 SQLite 连接池 (Phase 2-D)
# 使用 r2d2 通用连接池 + r2d2_sqlite 适配 rusqlite，
# 让所有需要 DB 访问的引擎共享同一个连接池，避免多连接导致的
# 锁竞争和数据视图不一致问题。
# r2d2_sqlite 0.25 对应 rusqlite ^0.32（与各 engine crate 使用的版本一致）。
# 来源: https://crates.io/crates/r2d2_sqlite
# ============================================================
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# ============================================================
# flutter_rust_bridge v2 —— 类型安全 FFI 绑定
# 自动生成 Dart 绑定，消除手写 malloc/free 和 JSON 序列化
# 支持 async/await、Stream、SSE 编解码器
# 来源: https://crates.io/crates/flutter_rust_bridge
# ============================================================
flutter_rust_bridge = "=2.12.0"
