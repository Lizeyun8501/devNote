[package]
name = "devnote-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# P1 架构修复 (3.7): 清理未使用依赖
# 已移除: devnote-crypto（未使用）、x25519-dalek（未使用）、rand_core（未使用）、hmac（未使用）
# 注: tracing 被 devnote-observe 导出的 #[instrument] 宏内部引用，需显式依赖
devnote-observe = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
devnote-crdt = { workspace = true }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
lazy_static = "1"
