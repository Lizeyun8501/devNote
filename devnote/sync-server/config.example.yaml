# DevNote Sync Server 配置文件
# P2-7: Viper 统一配置管理
#
# 配置优先级: 环境变量 > 配置文件 > 默认值
# 环境变量名见 config.go 中 BindEnv 调用（保持向后兼容）
#
# 部署: 将此文件放置于以下任一路径（按搜索顺序）:
#   ./config.yaml
#   ./config/config.yaml
#   /etc/devnote/sync-server/config.yaml

# 服务端口
port: "8080"
http_port: "8081"  # HTTP→HTTPS 重定向端口

# 数据库
db_path: "./data/sync.db"
migrations_path: "./migrations"

# JWT 密钥（生产环境必须设置，至少 32 字节）
# 建议通过环境变量 JWT_SECRET 注入，避免写入配置文件
jwt_secret: ""

# CORS
allowed_origins:
  - "*"

# S3 对象存储（可选，用于大附件存储）
s3_endpoint: ""
s3_access_key: ""
s3_secret_key: ""
s3_bucket: "devnote-sync"
s3_use_ssl: false

# TLS / HTTP2
enable_tls: false
auto_cert: false
http2_enabled: true
tls_cert_file: "./data/cert.pem"
tls_key_file: "./data/key.pem"

# 限流（每秒请求数）
rate_limit: 100

# 日志
log_level: "info"   # debug | info | warn | error
log_format: "json"   # json | console

# 邮件转笔记
email_webhook_secret: ""  # Webhook 签名验证密钥
email_domain: "mail.devnote.app"
